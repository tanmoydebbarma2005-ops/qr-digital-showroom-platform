<script>
  // ==========================================
  // SUPABASE CONNECTION DETAILS
  // ==========================================
  const SUPABASE_URL = "https://hjtreamfqfunsmhbpvma.supabase.co";
  const SUPABASE_KEY = "sb_publishable_vaJ_wmk5EIr5H-3I8CGZxQ_tDVgi43s";

  // Initialize Supabase (FIXED: renamed to supabaseClient)
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  function esc(s) {
    return String(s || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
  }

  async function draw() {
    const { data: dealers, error } = await supabaseClient
      .from('dealerships')
      .select('*')
      .order('created_at', { ascending: false });

    if (error) {
      console.error("Error fetching data:", error);
      alert("Could not fetch data. Check console.");
      return;
    }

    document.getElementById("count").textContent = dealers.length;
    document.getElementById("active").textContent = dealers.filter(d => d.status === "Active").length;
    
    if (dealers.length === 0) {
        document.getElementById("rows").innerHTML = `<tr><td colspan="6" style="text-align:center;">No dealerships found. Add one!</td></tr>`;
    } else {
        document.getElementById("rows").innerHTML = dealers.map(d => `
          <tr>
            <td>${esc(d.name)}</td>
            <td>${esc(d.brand)}</td>
            <td>${esc(d.owner)}</td>
            <td>${esc(d.phone)}</td>
            <td>${esc(d.location || "Location not set")}</td>
            <td><span class="status">${esc(d.status)}</span></td>
          </tr>
        `).join("");
    }
  }

  document.getElementById("form").addEventListener("submit", async function(e) {
    e.preventDefault();
    
    const nameVal = document.getElementById("dealerName").value.trim();
    const brandVal = document.getElementById("brand").value;
    const ownerVal = document.getElementById("owner").value.trim();
    const phoneVal = document.getElementById("phone").value.trim();
    const locVal = document.getElementById("location").value.trim();

    const { data, error } = await supabaseClient
      .from('dealerships')
      .insert([
        { name: nameVal, brand: brandVal, owner: ownerVal, phone: phoneVal, location: locVal }
      ]);

    if (error) {
      alert("Error saving to database: " + error.message);
      console.error(error);
    } else {
      this.reset(); 
      draw();
    }
  });

  draw();
</script>
