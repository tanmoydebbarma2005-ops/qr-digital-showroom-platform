<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ShowroomQR — 30-Item Multi-Dealer QR Catalog</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen">

  <!-- Top Navigation Bar -->
  <header class="bg-slate-900 text-white px-4 py-3 flex justify-between items-center sticky top-0 z-50 shadow-md">
    <div class="flex items-center gap-2 cursor-pointer" onclick="switchMode('dealer')">
      <span class="bg-amber-500 text-slate-950 font-black px-2 py-0.5 rounded text-sm">QR</span>
      <div>
        <h1 class="font-bold text-base leading-none">ShowroomQR</h1>
        <p class="text-[10px] text-slate-400">30-Item Dealer Catalog</p>
      </div>
    </div>

    <div class="flex bg-slate-800 p-1 rounded-lg text-xs font-medium">
      <button id="tab-dealer" onclick="switchMode('dealer')" class="px-3 py-1.5 rounded-md bg-amber-500 text-slate-950 font-bold transition">
        Dealer Admin
      </button>
      <button id="tab-customer" onclick="switchMode('customer')" class="px-3 py-1.5 rounded-md text-slate-300 hover:text-white transition">
        Customer View
      </button>
    </div>
  </header>

  <main class="max-w-lg mx-auto p-4 pb-24">

    <!-- ==================== 1. DEALER ADMIN DASHBOARD ==================== -->
    <section id="view-dealer" class="space-y-5">

      <!-- Shop Switcher / Create New Shop -->
      <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 space-y-3">
        <div class="flex justify-between items-center">
          <label class="text-xs font-bold uppercase tracking-wider text-slate-500">Active Shop Account</label>
          <button onclick="toggleNewShopForm()" class="text-xs font-semibold text-amber-600 hover:underline">
            + Register New Shop
          </button>
        </div>

        <select id="shop-selector" onchange="selectShop(this.value)" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-sm font-bold text-slate-900 focus:outline-none focus:border-amber-500"></select>

        <!-- Hidden New Shop Form -->
        <form id="new-shop-form" onsubmit="createShop(event)" class="hidden pt-3 border-t border-slate-100 space-y-2.5">
          <input type="text" id="shop-name" placeholder="Showroom / Shop Name (e.g., Horizon Honda)" required class="w-full text-sm border border-slate-300 rounded-lg px-3 py-2" />
          <div class="grid grid-cols-2 gap-2">
            <input type="text" id="shop-city" placeholder="Location (e.g., Agartala)" required class="w-full text-sm border border-slate-300 rounded-lg px-3 py-2" />
            <input type="tel" id="shop-whatsapp" placeholder="WhatsApp (e.g., 919876543210)" required class="w-full text-sm border border-slate-300 rounded-lg px-3 py-2" />
          </div>
          <button type="submit" class="w-full bg-slate-900 text-white text-xs font-bold py-2.5 rounded-lg hover:bg-slate-800">
            Create Shop & Unlock 30 Free Slots
          </button>
        </form>

        <!-- Shop Summary & Storefront QR -->
        <div class="pt-3 border-t border-slate-100 flex justify-between items-center">
          <div>
            <p id="active-shop-meta" class="text-xs text-slate-500"></p>
          </div>
          <button onclick="openShopQr()" class="bg-slate-900 text-white text-xs px-3 py-2 rounded-lg font-semibold hover:bg-slate-800 flex items-center gap-1.5">
            <span>Showroom QR</span>
          </button>
        </div>

        <!-- 30-Item Limit Meter -->
        <div class="bg-slate-50 p-3 rounded-xl border border-slate-200">
          <div class="flex justify-between text-xs font-bold mb-1.5">
            <span class="text-slate-700">Free Catalog Limit (Max 30)</span>
            <span id="slot-counter" class="text-amber-600">0 / 30 Items</span>
          </div>
          <div class="w-full bg-slate-200 rounded-full h-2.5 overflow-hidden">
            <div id="slot-bar" class="bg-amber-500 h-2.5 rounded-full transition-all duration-300" style="width: 0%"></div>
          </div>
        </div>
      </div>

      <!-- Add Product / Bike Form -->
      <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200">
        <h2 class="font-bold text-sm text-slate-800 mb-3">+ Add Vehicle / Product</h2>
        <form id="product-form" onsubmit="addProduct(event)" class="space-y-3">
          <input type="text" id="prod-name" placeholder="Model Name (e.g., Royal Enfield Classic 350)" required class="w-full text-sm border border-slate-300 rounded-lg px-3 py-2 focus:outline-none focus:border-amber-500" />
          
          <div class="grid grid-cols-2 gap-2">
            <input type="text" id="prod-spec" placeholder="Key Spec (e.g., 349cc • 35 kmpl)" required class="w-full text-sm border border-slate-300 rounded-lg px-3 py-2 focus:outline-none focus:border-amber-500" />
            <input type="text" id="prod-colors" placeholder="Colors (Black, Red, Chrome)" required class="w-full text-sm border border-slate-300 rounded-lg px-3 py-2 focus:outline-none focus:border-amber-500" />
          </div>

          <!-- Variant & Price Builder -->
          <div class="bg-slate-50 p-3 rounded-xl border border-slate-200 space-y-2">
            <div class="flex justify-between items-center">
              <span class="text-xs font-bold text-slate-600">Variants & On-Road Prices</span>
              <button type="button" onclick="addVariantRow()" class="text-xs font-bold text-amber-600 hover:underline">+ Add Variant</button>
            </div>
            <div id="variant-inputs" class="space-y-2">
              <div class="grid grid-cols-2 gap-2 variant-row">
                <input type="text" placeholder="Variant (e.g., Standard)" required class="v-name text-xs border border-slate-300 rounded-lg px-2.5 py-1.5 bg-white" />
                <input type="number" placeholder="Price in ₹ (e.g., 193000)" required class="v-price text-xs border border-slate-300 rounded-lg px-2.5 py-1.5 bg-white" />
              </div>
            </div>
          </div>

          <button id="submit-prod-btn" type="submit" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold text-sm py-2.5 rounded-xl transition shadow-sm">
            Save Item & Generate QR Code
          </button>
        </form>
      </div>

      <!-- Dealer Inventory List -->
      <div>
        <div class="flex justify-between items-center mb-2 px-1">
          <h3 class="font-bold text-sm text-slate-700">Showroom Catalog Items</h3>
          <span class="text-[11px] text-slate-400">Tap QR to print/preview</span>
        </div>
        <div id="dealer-inventory" class="space-y-3"></div>
      </div>
    </section>

    <!-- ==================== 2. CUSTOMER SCAN VIEW ==================== -->
    <section id="view-customer" class="hidden space-y-4">
      <!-- Showroom Banner -->
      <div class="bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900 text-white p-5 rounded-2xl shadow-md">
        <div class="flex justify-between items-start">
          <div>
            <span class="inline-block bg-amber-500/20 text-amber-400 border border-amber-500/30 text-[10px] font-bold uppercase px-2 py-0.5 rounded-full">
              Official Digital Catalog
            </span>
            <h2 id="cust-shop-name" class="text-2xl font-extrabold mt-1"></h2>
            <p id="cust-shop-city" class="text-xs text-slate-300 mt-0.5"></p>
          </div>
        </div>
      </div>

      <!-- Focused Scanned Product Banner (Shown when user scans a specific bike QR) -->
      <div id="focused-banner" class="hidden bg-amber-50 border border-amber-300 p-3 rounded-xl flex justify-between items-center">
        <span class="text-xs font-semibold text-amber-900">Showing scanned bike first</span>
        <button onclick="clearFocusedProduct()" class="text-xs font-bold text-amber-700 underline">View All Models</button>
      </div>

      <!-- Customer Product Feed -->
      <div id="customer-catalog" class="space-y-4"></div>
    </section>

  </main>

  <!-- ==================== QR CODE MODAL ==================== -->
  <div id="qr-modal" class="fixed inset-0 bg-black/70 hidden items-center justify-center p-4 z-50 backdrop-blur-xs">
    <div class="bg-white rounded-2xl p-6 max-w-xs w-full text-center shadow-2xl space-y-3">
      <span class="text-[10px] font-bold uppercase tracking-wider bg-amber-100 text-amber-800 px-2.5 py-1 rounded-full">Scan with Phone Camera</span>
      <h3 id="modal-title" class="font-extrabold text-lg text-slate-900 leading-tight"></h3>
      <p id="modal-subtitle" class="text-xs text-slate-500"></p>
      
      <div id="qrcode-box" class="my-3 flex justify-center p-4 bg-white rounded-xl border-2 border-dashed border-slate-300"></div>
      
      <p id="modal-link" class="text-[10px] text-slate-400 break-all bg-slate-50 p-2 rounded"></p>
      
      <div class="grid grid-cols-2 gap-2 pt-2">
        <button onclick="simulateScan()" class="bg-amber-500 hover:bg-amber-600 text-slate-950 py-2 rounded-xl text-xs font-bold">
          Simulate Scan
        </button>
        <button onclick="closeModal()" class="bg-slate-900 hover:bg-slate-800 text-white py-2 rounded-xl text-xs font-bold">
          Close
        </button>
      </div>
    </div>
  </div>

  <script>
    const MAX_ITEMS_PER_SHOP = 30;
    const STORAGE_KEY = 'showroom_qr_data_v1';

    // Default Demo Data
    const defaultData = {
      activeShopId: 'shop-1',
      shops: [
        {
          id: 'shop-1',
          name: 'Apex Two-Wheelers',
          city: 'Agartala, Tripura',
          whatsapp: '919876543210',
          products: [
            {
              id: 'p-101',
              name: 'Yamaha MT-15 V2',
              spec: '155cc Liquid Cooled • 48 kmpl',
              colors: ['Metallic Black', 'Cyan Storm', 'Ice Fluo'],
              variants: [
                { name: 'Standard', price: 168900 },
                { name: 'Deluxe MotoGP', price: 173500 }
              ]
            },
            {
              id: 'p-102',
              name: 'TVS Apache RTR 160 4V',
              spec: '159.7cc • Ride Modes',
              colors: ['Racing Red', 'Knight Black'],
              variants: [
                { name: 'Drum Brake', price: 124870 },
                { name: 'Single Disc', price: 128500 },
                { name: 'Dual Channel ABS', price: 135200 }
              ]
            }
          ]
        }
      ]
    };

    let appState = JSON.parse(localStorage.getItem(STORAGE_KEY)) || defaultData;
    let focusedProductId = null;
    let pendingSimulatedHash = '';

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
    }

    function getActiveShop() {
      return appState.shops.find(s => s.id === appState.activeShopId) || appState.shops[0];
    }

    // ==================== SHOP MANAGEMENT ====================
    function toggleNewShopForm() {
      document.getElementById('new-shop-form').classList.toggle('hidden');
    }

    function createShop(e) {
      e.preventDefault();
      const name = document.getElementById('shop-name').value.trim();
      const city = document.getElementById('shop-city').value.trim();
      const whatsapp = document.getElementById('shop-whatsapp').value.replace(/\D/g, '');

      const newShop = {
        id: 'shop-' + Date.now(),
        name,
        city,
        whatsapp,
        products: []
      };

      appState.shops.push(newShop);
      appState.activeShopId = newShop.id;
      saveState();

      e.target.reset();
      toggleNewShopForm();
      renderAll();
    }

    function selectShop(shopId) {
      appState.activeShopId = shopId;
      focusedProductId = null;
      saveState();
      renderAll();
    }

    // ==================== PRODUCT & 30-ITEM LIMIT ====================
    function addVariantRow() {
      const container = document.getElementById('variant-inputs');
      const row = document.createElement('div');
      row.className = 'grid grid-cols-2 gap-2 variant-row';
      row.innerHTML = `
        <input type="text" placeholder="Variant (e.g., ABS Pro)" required class="v-name text-xs border border-slate-300 rounded-lg px-2.5 py-1.5 bg-white" />
        <input type="number" placeholder="Price in ₹" required class="v-price text-xs border border-slate-300 rounded-lg px-2.5 py-1.5 bg-white" />
      `;
      container.appendChild(row);
    }

    function addProduct(e) {
      e.preventDefault();
      const shop = getActiveShop();
      if (shop.products.length >= MAX_ITEMS_PER_SHOP) {
        alert('You have reached the 30-item limit for this shop.');
        return;
      }

      const name = document.getElementById('prod-name').value.trim();
      const spec = document.getElementById('prod-spec').value.trim();
      const colors = document.getElementById('prod-colors').value.split(',').map(c => c.trim()).filter(Boolean);

      const variantRows = document.querySelectorAll('#variant-inputs .variant-row');
      const variants = [];
      variantRows.forEach(row => {
        const vName = row.querySelector('.v-name').value.trim();
        const vPrice = Number(row.querySelector('.v-price').value);
        if (vName && vPrice) variants.push({ name: vName, price: vPrice });
      });

      const newProduct = {
        id: 'p-' + Date.now(),
        name,
        spec,
        colors,
        variants
      };

      shop.products.unshift(newProduct);
      saveState();

      // Reset form & variant rows
      e.target.reset();
      document.getElementById('variant-inputs').innerHTML = `
        <div class="grid grid-cols-2 gap-2 variant-row">
          <input type="text" placeholder="Variant (e.g., Standard)" required class="v-name text-xs border border-slate-300 rounded-lg px-2.5 py-1.5 bg-white" />
          <input type="number" placeholder="Price in ₹ (e.g., 193000)" required class="v-price text-xs border border-slate-300 rounded-lg px-2.5 py-1.5 bg-white" />
        </div>
      `;

      renderAll();
      openProductQr(newProduct.id);
    }

    function deleteProduct(prodId) {
      const shop = getActiveShop();
      shop.products = shop.products.filter(p => p.id !== prodId);
      saveState();
      renderAll();
    }

    // ==================== QR GENERATION & DEEP LINKING ====================
    function buildQrUrl(shopId, prodId = '') {
      const baseUrl = window.location.href.split('#')[0];
      const hash = prodId ? `#scan=${shopId}/${prodId}` : `#scan=${shopId}`;
      return { fullUrl: baseUrl + hash, hash };
    }

    function openShopQr() {
      const shop = getActiveShop();
      const { fullUrl, hash } = buildQrUrl(shop.id);
      showQrModal(shop.name, 'Full Showroom Catalog (All Models)', fullUrl, hash);
    }

    function openProductQr(prodId) {
      const shop = getActiveShop();
      const prod = shop.products.find(p => p.id === prodId);
      if (!prod) return;
      const { fullUrl, hash } = buildQrUrl(shop.id, prod.id);
      showQrModal(prod.name, `${shop.name} • Direct Bike QR`, fullUrl, hash);
    }

    function showQrModal(title, subtitle, url, hash) {
      document.getElementById('modal-title').innerText = title;
      document.getElementById('modal-subtitle').innerText = subtitle;
      document.getElementById('modal-link').innerText = url;
      pendingSimulatedHash = hash;

      const box = document.getElementById('qrcode-box');
      box.innerHTML = '';
      new QRCode(box, {
        text: url,
        width: 170,
        height: 170,
        colorDark: '#0f172a',
        colorLight: '#ffffff',
        correctLevel: QRCode.CorrectLevel.H
      });

      const modal = document.getElementById('qr-modal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function closeModal() {
      const modal = document.getElementById('qr-modal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    function simulateScan() {
      closeModal();
      window.location.hash = pendingSimulatedHash;
      handleHashNavigation();
    }

    function handleHashNavigation() {
      const hash = window.location.hash;
      if (hash.startsWith('#scan=')) {
        const path = hash.replace('#scan=', '');
        const [shopId, prodId] = path.split('/');
        if (appState.shops.some(s => s.id === shopId)) {
          appState.activeShopId = shopId;
        }
        focusedProductId = prodId || null;
        switchMode('customer');
      }
    }

    function clearFocusedProduct() {
      focusedProductId = null;
      history.replaceState(null, '', window.location.pathname);
      renderCustomerView();
    }

    // ==================== RENDERING ====================
    function formatINR(num) {
      return '₹' + Number(num).toLocaleString('en-IN');
    }

    function renderAll() {
      const shop = getActiveShop();

      // Populate shop dropdown
      const selector = document.getElementById('shop-selector');
      selector.innerHTML = appState.shops.map(s =>
        `<option value="${s.id}" ${s.id === shop.id ? 'selected' : ''}>${s.name} (${s.products.length}/30)</option>`
      ).join('');

      document.getElementById('active-shop-meta').innerText = `${shop.city} • WhatsApp: +${shop.whatsapp}`;

      // Update 30-item counter
      const count = shop.products.length;
      document.getElementById('slot-counter').innerText = `${count} / ${MAX_ITEMS_PER_SHOP} Items`;
      document.getElementById('slot-bar').style.width = `${(count / MAX_ITEMS_PER_SHOP) * 100}%`;

      const submitBtn = document.getElementById('submit-prod-btn');
      if (count >= MAX_ITEMS_PER_SHOP) {
        submitBtn.disabled = true;
        submitBtn.innerText = '30-Item Limit Reached (Delete an item to add more)';
        submitBtn.classList.add('opacity-50', 'cursor-not-allowed');
      } else {
        submitBtn.disabled = false;
        submitBtn.innerText = 'Save Item & Generate QR Code';
        submitBtn.classList.remove('opacity-50', 'cursor-not-allowed');
      }

      // Render Dealer Inventory
      const invContainer = document.getElementById('dealer-inventory');
      if (shop.products.length === 0) {
        invContainer.innerHTML = `<div class="bg-white p-6 rounded-2xl text-center text-xs text-slate-400 border border-dashed border-slate-300">No items added yet. Use the form above to add up to 30 products.</div>`;
      } else {
        invContainer.innerHTML = shop.products.map(p => `
          <div class="bg-white p-3.5 rounded-2xl border border-slate-200 shadow-xs flex justify-between items-center gap-3">
            <div class="min-w-0 flex-1">
              <h4 class="font-bold text-sm text-slate-900 truncate">${p.name}</h4>
              <p class="text-xs text-slate-500">${p.spec}</p>
              <p class="text-xs font-bold text-amber-700 mt-1">Starting ${formatINR(p.variants[0]?.price || 0)} • ${p.variants.length} Variant(s)</p>
            </div>
            <div class="flex items-center gap-2 shrink-0">
              <button onclick="openProductQr('${p.id}')" class="bg-amber-100 hover:bg-amber-200 text-amber-900 font-bold text-xs px-3 py-2 rounded-xl">
                QR Code
              </button>
              <button onclick="deleteProduct('${p.id}')" class="text-xs text-red-500 hover:text-red-700 px-1.5 py-2">
                ✕
              </button>
            </div>
          </div>
        `).join('');
      }

      renderCustomerView();
    }

    function renderCustomerView() {
      const shop = getActiveShop();
      document.getElementById('cust-shop-name').innerText = shop.name;
      document.getElementById('cust-shop-city').innerText = shop.city;

      const focusedBanner = document.getElementById('focused-banner');
